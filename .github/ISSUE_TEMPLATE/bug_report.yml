name: Bug report
description: Something in the starter doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Remove keys, tokens and personal data from anything you paste.
        Found a security problem? Don't file it here: email budemadeofficial@gmail.com (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Sign-in and accounts
        - Teams, roles and permissions
        - Payments and plans
        - AI assistant or MCP server
        - Admin console
        - Setup and deployment
        - Docs
        - Other
    validations:
      required: true
  - type: dropdown
    id: supabase
    attributes:
      label: Supabase
      options:
        - Hosted project
        - Local (Supabase CLI)
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: Python 3.12, Node 24, Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: text
